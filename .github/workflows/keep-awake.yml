# Keeps the free Render backend awake so visitors (and judges) never wait for a
# cold start. Render's free plan sleeps after 15 idle minutes; 750 free hours a
# month cover one always-on service. Disable this workflow after judging.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 https://agentos-backend-qa0p.onrender.com/api/health
